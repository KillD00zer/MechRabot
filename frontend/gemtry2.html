<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MechRabot - Protocol Nemesis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sidebar: '#1c1d21',
                        chatbg: '#2f3036',
                        userbubble: '#3b82f6',
                        aibubble: '#3e3f4b',
                        inputbg: '#3e3f4b'
                    }
                }
            }
        }
    </script>
    <style>
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .markdown-body th, .markdown-body td { border: 1px solid #52525b; padding: 8px; text-align: left; }
        .markdown-body th { background-color: #3f3f46; }
    </style>
</head>
<body class="bg-chatbg text-gray-100 font-sans h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <div class="w-64 bg-sidebar hidden md:flex flex-col border-r border-gray-700">
        <div class="p-4 border-b border-gray-700 flex items-center gap-3">
            <i class="fa-solid fa-robot text-2xl text-yellow-500"></i>
            <div>
                <h1 class="font-bold text-lg text-yellow-500">MechRabot</h1>
                <p class="text-xs text-gray-400">Chery M11 Assistant</p>
            </div>
        </div>
        <div class="p-4 flex-1 flex flex-col justify-end">
            <div class="text-xs text-gray-500 text-center border-t border-gray-800 pt-4 opacity-70 hover:opacity-100 transition">
                <i class="fa-solid fa-shield-halved mb-1"></i><br>
                Protocol-Nemesis V1.0<br>
                <span class="text-green-500 font-bold">● System Online</span>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col relative h-full">
        <!-- Chat Display Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 pb-32 space-y-6">
            
            <!-- Welcome Message -->
            <div class="flex gap-4 max-w-4xl mx-auto">
                <div class="w-8 h-8 rounded-full bg-yellow-500 flex items-center justify-center flex-shrink-0 text-black">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div class="bg-aibubble p-4 rounded-2xl rounded-tl-none text-sm leading-relaxed shadow-sm w-full markdown-body">
                    Welcome, Engineer, to the <strong>MechRabot</strong> system.
                    <br>I am ready to extract torque specifications, part numbers, and maintenance procedures. How can I assist you today?
                </div>
            </div>

        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 right-0 bg-chatbg/90 backdrop-blur-sm p-4 border-t border-gray-700">
            <div class="max-w-4xl mx-auto relative">
                <textarea id="user-input" rows="1" placeholder="Ask about maintenance details... (Press Enter to send)" 
                    class="w-full bg-inputbg text-gray-100 rounded-xl pr-12 pl-4 py-4 focus:outline-none focus:ring-1 focus:ring-yellow-500 resize-none overflow-hidden shadow-lg border border-gray-600"></textarea>
                <button id="send-btn" class="absolute right-3 top-1/2 -translate-y-1/2 bg-yellow-600 hover:bg-yellow-500 text-black w-8 h-8 rounded-lg flex items-center justify-center transition">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            <div class="text-center text-[10px] text-gray-500 mt-2">
                Powered by BGE-M3 & DeepSeek | Protocol-Nemesis
            </div>
        </div>
    </div>

    <script>
        // Modal API URL
        const API_URL = "https://killd00zer--mechrabot-query-endpoint.modal.run";
        
        // المسارات لملفات الفيديو بتاعتك (موجودين في نفس فولدر الـ HTML)
        const BUMBLEBEE_RUNNING = "running.mp4"; 
        const BUMBLEBEE_SALUTE = "ready.mp4"; // حط ملف التحية بنفس الاسم في نفس الفولدر

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Append Message to UI
        function appendMessage(role, text, sources = []) {
            const isUser = role === 'user';
            const bubbleColor = isUser ? 'bg-userbubble' : 'bg-aibubble';
            const icon = isUser ? '<i class="fa-solid fa-user text-sm"></i>' : '<i class="fa-solid fa-robot text-sm"></i>';
            const roundedClass = isUser ? 'rounded-tr-none' : 'rounded-tl-none';
            const avatarBg = isUser ? 'bg-gray-600' : 'bg-yellow-500 text-black';
            
            const htmlText = isUser ? text : marked.parse(text);

            let messageDiv = document.createElement('div');
            messageDiv.className = `flex gap-4 max-w-4xl mx-auto ${isUser ? 'flex-row-reverse' : ''}`;
            
            let htmlContent = `
                <div class="w-8 h-8 rounded-full ${avatarBg} flex items-center justify-center flex-shrink-0">
                    ${icon}
                </div>
                <div class="flex flex-col gap-2 w-full ${isUser ? 'items-end' : 'items-start'}">
                    <div class="${bubbleColor} p-4 rounded-2xl ${roundedClass} text-sm leading-relaxed shadow-sm max-w-[85%] markdown-body">
                        ${htmlText}
                    </div>
            `;

            if (!isUser && sources.length > 0) {
                let imagesHtml = '';
                let addedImages = new Set();
                
                sources.forEach(source => {
                    if (source.linked_images && source.linked_images.length > 0) {
                        source.linked_images.forEach(imgPath => {
                            if (!addedImages.has(imgPath)) {
                                imagesHtml += `
                                    <div class="mt-2 p-2 bg-gray-800 rounded-lg border border-gray-700 w-64">
                                        <div class="text-xs text-gray-400 mb-1"><i class="fa-regular fa-image"></i> Attached Diagram</div>
                                        <div class="w-full h-32 bg-gray-700 rounded flex items-center justify-center text-xs text-gray-500 break-all text-center px-2">
                                            ${imgPath.split('/').pop()}
                                        </div>
                                    </div>
                                `;
                                addedImages.add(imgPath);
                            }
                        });
                    }
                });
                
                if(imagesHtml !== '') {
                    htmlContent += `<div class="flex flex-wrap gap-2">${imagesHtml}</div>`;
                }
            }

            htmlContent += `</div>`;
            messageDiv.innerHTML = htmlContent;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

// Show MechRabot Running (Video version) - تكبير الحجم وتغيير الاسم
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-indicator';
            loadingDiv.className = 'flex gap-4 max-w-4xl mx-auto items-center'; // ضفنا items-center عشان الكلام يتوسطن مع الدائرة الكبيرة
            loadingDiv.innerHTML = `
                <!-- كبرنا الحجم لـ w-24 h-24 وتخنا الإطار لـ border-4 -->
                <div class="w-24 h-24 rounded-full bg-yellow-500 flex items-center justify-center flex-shrink-0 border-4 border-yellow-600 overflow-hidden shadow-[0_0_20px_rgba(234,179,8,0.5)] p-1">
                    <video id="mechrabot-status" src="${BUMBLEBEE_RUNNING}" autoplay loop muted playsinline class="w-full h-full object-cover rounded-full"></video>
                </div>
                <!-- كبرنا الخط لـ text-lg وغيرنا الاسم -->
                <div class="bg-aibubble p-5 rounded-2xl rounded-tl-none flex items-center text-yellow-500 text-lg font-bold tracking-wider shadow-md">
                    <i class="fa-solid fa-bolt mr-2 animate-pulse"></i> MechRabot is fetching data...
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Hide Loading
        function hideLoading() {
            const loadingDiv = document.getElementById('loading-indicator');
            if (loadingDiv) loadingDiv.remove();
        }

        // Handle Send Request
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            
            // 1. Show Bumblebee Running
            showLoading();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });

                const data = await response.json();
                
                // 2. Change to Salute Video
                const beeStatus = document.getElementById('bumblebee-status');
                if (beeStatus) {
                    beeStatus.src = BUMBLEBEE_SALUTE;
                    beeStatus.parentElement.nextElementSibling.innerHTML = `<i class="fa-solid fa-check-double mr-2"></i> Data retrieved!`;
                }

                // 3. Wait 1.5 seconds, then show response
                setTimeout(() => {
                    hideLoading();
                    if (response.ok) {
                        appendMessage('assistant', data.answer || "No information found.", data.sources || []);
                    } else {
                        appendMessage('assistant', `❌ Server Error: ${response.status}`);
                    }
                }, 1500);

            } catch (error) {
                hideLoading();
                appendMessage('assistant', `❌ Network error or server is down.`);
                console.error(error);
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
